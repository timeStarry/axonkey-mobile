name: Build tagged app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: build-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-metadata:
    name: Verify release tag and repository version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      version_code: ${{ steps.metadata.outputs.version_code }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify release tag against manifests
        id: metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node scripts/repo-version.mjs check "$TAG_NAME" --github-output "$GITHUB_OUTPUT"

  test-release:
    needs: release-metadata
    name: Run release test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript & Vitest verification
        run: pnpm check

  build-android:
    needs: [release-metadata, test-release]
    name: Build signed Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_VERSION: ${{ needs.release-metadata.outputs.version }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate persistent Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD must all be configured in repository secrets so in-app APK upgrades preserve consistent signing identity." >&2
            exit 1
          fi

      - name: Install Web dependencies & sync assets
        run: |
          pnpm install --frozen-lockfile
          pnpm sync:android

      - name: Assemble R8-shrunk signed Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK signature & generate SHA-256 checksum
        shell: bash
        run: |
          RAW_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$RAW_APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          if [[ -z "$APKSIGNER" ]]; then
            echo "Could not locate apksigner in ANDROID_HOME=$ANDROID_HOME" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$RAW_APK"

          mkdir -p dist-release
          ASSET_NAME="Axonkey_Mobile_${APP_VERSION}_universal.apk"
          cp "$RAW_APK" "dist-release/${ASSET_NAME}"
          (
            cd dist-release
            sha256sum "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
            sha256sum --check "${ASSET_NAME}.sha256"
          )

      - name: Upload signed APK & checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: Axonkey-Mobile-v${{ needs.release-metadata.outputs.version }}-android
          path: dist-release/*
          if-no-files-found: error

  publish-release:
    needs: [release-metadata, build-android]
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository history for release notes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download signed APK artifact
        uses: actions/download-artifact@v4
        with:
          name: Axonkey-Mobile-v${{ needs.release-metadata.outputs.version }}-android
          path: release-assets

      - name: Verify release assets & SHA-256 checksum
        id: checksum
        shell: bash
        env:
          APP_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          ASSET_NAME="Axonkey_Mobile_${APP_VERSION}_universal.apk"
          (
            cd release-assets
            sed -i 's/\r$//' ./*.sha256
            sha256sum --check "${ASSET_NAME}.sha256"
          )
          SHA256_HEX=$(awk '{print $1}' "release-assets/${ASSET_NAME}.sha256")
          echo "sha256=${SHA256_HEX}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare release notes with SHA-256 verification digest
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          SHA256_HEX: ${{ steps.checksum.outputs.sha256 }}
          ASSET_NAME: ${{ steps.checksum.outputs.asset_name }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          rm -f "$RELEASE_NOTES_FILE"
          if [[ -s "docs/releases/$TAG_NAME.md" ]]; then
            cp "docs/releases/$TAG_NAME.md" "$RELEASE_NOTES_FILE"
          else
            PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)
            {
              echo "## 更新内容"
              echo ""
              if [[ -n "$PREV_TAG" ]]; then
                git log "${PREV_TAG}..${TAG_NAME}" --no-merges --pretty=format:'- %s (%h)'
              else
                git log -n 20 --no-merges --pretty=format:'- %s (%h)'
              fi
              echo ""
            } > "$RELEASE_NOTES_FILE"
          fi
          {
            echo ""
            echo "---"
            echo "### 安装包校验信息"
            echo "- 文件：\`${ASSET_NAME}\`"
            echo "- SHA256: \`${SHA256_HEX}\`"
          } >> "$RELEASE_NOTES_FILE"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          release_args=(--prerelease="$PRERELEASE")
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--latest=false)
          else
            release_args+=(--latest=true)
          fi

          if ! gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Axonkey Mobile $TAG_NAME" \
              --notes-file "$RELEASE_NOTES_FILE" \
              "${release_args[@]}" \
              --draft \
              --verify-tag
          fi

          gh release upload "$TAG_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          gh release edit "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            "${release_args[@]}" \
            --notes-file "$RELEASE_NOTES_FILE"
