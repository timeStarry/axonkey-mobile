name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Verify Web UI, Tests & Shrunk Release APK
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify repository version consistency
        run: node scripts/repo-version.mjs check

      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, run Vitest suite & sync Android assets
        run: |
          pnpm typecheck
          pnpm test
          pnpm sync:android

      - name: Build R8-minified Release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Report Release APK size
        shell: bash
        run: |
          APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          BYTES=$(stat -c%s "$APK_PATH")
          MB=$(awk "BEGIN { printf \"%.2f\", $BYTES / (1024 * 1024) }")
          echo "Release APK size: ${MB} MB (${BYTES} bytes)"
          echo "### Release APK Size" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`app-release.apk\`: **${MB} MB** (\`${BYTES}\` bytes)" >> "$GITHUB_STEP_SUMMARY"
